<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Korean Design MD — 국내 서비스 디자인 레퍼런스</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #ffffff;
  --surface:     #f7f8fa;
  --border:      #dee1e6;
  --border-hi:   #c8cdd6;
  --text-1:      #0a0b0d;
  --text-2:      #5b616e;
  --text-3:      #a8acb3;
  --accent:      #0052ff;
  --accent-dim:  rgba(0,82,255,0.07);
  --accent-line: rgba(0,82,255,0.20);
  --sans:        'Inter', -apple-system, system-ui, sans-serif;
  --mono:        'JetBrains Mono', monospace;
  --ease:        cubic-bezier(0.16,1,0.3,1);
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text-1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.site-header {
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 100;
}
.header-inner {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 40px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.site-logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.3; transform:scale(0.6); } }
.header-stats {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  gap: 20px;
}
.header-stats span { color: var(--text-2); font-weight: 600; }

/* ── Hero ── */
.hero {
  padding: 64px 40px 48px;
  max-width: 1160px;
  margin: 0 auto;
}
.hero-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--text-3);
  text-transform: uppercase;
  margin-bottom: 16px;
}
.hero-title {
  font-size: clamp(32px, 4vw, 52px);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.1;
  color: var(--text-1);
  margin-bottom: 20px;
}
.hero-title em { color: var(--accent); font-style: normal; }
.hero-desc {
  font-size: 15px;
  color: var(--text-2);
  line-height: 1.7;
  max-width: 500px;
}
.hero-desc strong { color: var(--text-1); font-weight: 600; }

/* ── Filter ── */
.filter-bar {
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 60px;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 90;
}
.filter-inner {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 40px;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-inner::-webkit-scrollbar { display: none; }
.filter-btn {
  background: none;
  border: none;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-3);
  padding: 16px 18px;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.filter-btn:hover { color: var(--text-2); }
.filter-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Grid ── */
.grid-wrap {
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 40px 80px;
}
.grid-empty {
  padding: 80px 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: 0.06em;
  display: none;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-top: 40px;
}

/* ── Card ── */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  transition: background 0.15s, box-shadow 0.2s;
}
.card.is-extracted:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.card.is-extracted { cursor: pointer; }
.card.is-extracted:hover .card-screenshot { transform: scale(1.03); }

.card-thumb {
  height: 168px;
  background: var(--surface);
  position: relative;
  overflow: hidden;
}
.card-screenshot {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
  transition: transform 0.4s var(--ease);
}
.card-accent-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  z-index: 1;
}
.card-logo-badge {
  position: absolute;
  bottom: 10px;
  left: 12px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(0,0,0,0.08);
  padding: 5px 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-logo {
  max-height: 20px;
  max-width: 80px;
  width: auto;
  object-fit: contain;
  display: block;
}
.card-swatches {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-shrink: 0;
}
.swatch {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.10);
  box-shadow: 0 1px 2px rgba(0,0,0,0.10);
}

.card-body { padding: 14px 20px 18px; }
.card-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.card-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-meta { display: flex; align-items: center; gap: 8px; }
.cat-tag {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 3px 7px;
  border: 1px solid var(--border);
  color: var(--text-3);
  text-transform: uppercase;
}
.cat-tag.ready {
  border-color: var(--accent-line);
  color: var(--accent);
  background: var(--accent-dim);
}
.card-date {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  margin-left: auto;
}
.card-ext-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  color: var(--text-3);
  text-decoration: none;
  margin-left: 6px;
  flex-shrink: 0;
  transition: color 0.15s;
}
.card-ext-link:hover { color: var(--accent); }

/* Pending overlay */
.pending-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.soon-badge {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--text-3);
  border: 1px solid var(--border);
  padding: 5px 12px;
  background: var(--bg);
  text-transform: uppercase;
}

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,11,13,0.55);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s var(--ease);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--bg);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 700px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  transform: translateY(20px);
  transition: transform 0.3s var(--ease);
}
.modal-overlay.open .modal { transform: translateY(0); }

.modal-top-band {
  height: 6px;
  flex-shrink: 0;
}
.modal-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-color-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.modal-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
}
.modal-cat {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border: 1px solid var(--accent-line);
  color: var(--accent);
  background: var(--accent-dim);
  text-transform: uppercase;
}
.modal-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-dl {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: #fff;
  background: var(--accent);
  border: none;
  padding: 8px 14px;
  cursor: pointer;
  transition: opacity 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.btn-dl:hover { opacity: 0.85; }
.btn-close {
  background: none;
  border: 1px solid var(--border);
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-3);
  transition: color 0.15s, border-color 0.15s;
}
.btn-close:hover { color: var(--text-1); border-color: var(--border-hi); }

.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 28px 24px;
}

/* DESIGN.md renderer */
.md-content { font-family: var(--mono); font-size: 12.5px; line-height: 1.9; color: var(--text-2); }
.md-h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: -0.02em;
  margin-bottom: 24px;
  font-family: var(--sans);
}
.md-h2 {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
  margin-top: 28px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--accent-line);
}
.md-row {
  display: grid;
  grid-template-columns: 160px 1fr;
  padding: 3px 0;
  gap: 8px;
}
.md-key { color: var(--text-3); }
.md-val { color: var(--text-1); display: flex; align-items: center; gap: 6px; }
.color-chip {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.08);
  flex-shrink: 0;
}
.md-plain { padding: 2px 0; color: var(--text-2); }

/* ── Mobile ── */
@media (max-width: 960px) {
  .card-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .header-inner, .filter-inner { padding-left: 20px; padding-right: 20px; }
  .hero, .grid-wrap { padding-left: 20px; padding-right: 20px; }
  .hero { padding-top: 40px; padding-bottom: 32px; }
  .card-grid { grid-template-columns: 1fr; }
  .modal { max-height: 92vh; }
  .md-row { grid-template-columns: 120px 1fr; }
}

</style>
</head>

/* ── 카테고리 목록 (순서 고정) ── */
const CATS = ['전체', '핀테크', '메신저', '이커머스', '배달', '뱅킹', '여행', '포털', 'OTT'];

let currentCat = '전체';
let currentItem = null;

/* ── Filter 렌더링 ── */
function renderFilter() {
  const wrap = document.getElementById('filterInner');
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === currentCat ? ' active' : '');
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = cat;
      renderCards();
    });
    wrap.appendChild(btn);
  });
}

/* ── Card 렌더링 ── */
function renderCards() {
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('gridEmpty');
  const list = currentCat === '전체' ? DATA : DATA.filter(d => d.category === currentCat);

  grid.innerHTML = '';

  if (list.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  grid.style.display = 'grid';
  empty.style.display = 'none';

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card' + (item.status === 'extracted' ? ' is-extracted' : '');

    const swatchHTML = item.swatches.map(c =>
      `<div class="swatch" style="background:${c}"></div>`
    ).join('');

    const screenshotUrl = `https://image.thum.io/get/width/640/crop/400/delay/10000/${item.siteUrl}`;

    card.innerHTML = `
      <div class="card-thumb">
        <div class="card-accent-line" style="background:${item.color}"></div>
        <img
          class="card-screenshot"
          src="${screenshotUrl}"
          alt="${item.name} 스크린샷"
          loading="lazy"
        />
        <div class="card-logo-badge">
          <img
            class="card-logo"
            src="${item.logoUrl}"
            alt="${item.name}"
            onerror="this.parentElement.style.display='none'"
          />
        </div>
      </div>
      <div class="card-body">
        <div class="card-name-row">
          <div class="card-name">${item.name}</div>
          <div class="card-swatches">${swatchHTML}</div>
        </div>
        <div class="card-meta">
          <span class="cat-tag ${item.status === 'extracted' ? 'ready' : ''}">${item.category}</span>
          <span class="card-date">${item.date ?? '—'}</span>
          <a class="card-ext-link" href="${item.siteUrl}" target="_blank" rel="noopener" title="${item.name} 사이트 방문" onclick="event.stopPropagation()">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2H2.5A1.5 1.5 0 001 3.5v6A1.5 1.5 0 002.5 11h6A1.5 1.5 0 0010 9.5V7"/><path d="M7 1h4v4M11 1L5.5 6.5"/></svg>
          </a>
        </div>
      </div>
      ${item.status === 'pending' ? '<div class="pending-overlay"><div class="soon-badge">추출 예정</div></div>' : ''}
    `;

    if (item.status === 'extracted') {
      card.addEventListener('click', () => openModal(item));
    }
    grid.appendChild(card);
  });
}

/* ── Stats 업데이트 ── */
function updateStats() {
  document.getElementById('statTotal').textContent = DATA.length;
  document.getElementById('statExtracted').textContent = DATA.filter(d => d.status === 'extracted').length;
}

/* ── Modal ── */
function openModal(item) {
  currentItem = item;
  document.getElementById('modalBand').style.background = item.color;
  document.getElementById('modalDot').style.background = item.color;
  document.getElementById('modalName').textContent = item.name;
  document.getElementById('modalCat').textContent = item.category;
  document.getElementById('modalContent').innerHTML = renderMd(item.design);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  currentItem = null;
}

/* ── DESIGN.md 렌더러 ── */
function renderMd(md) {
  if (!md) return '';
  const lines = md.split('\n');
  let html = '<div>';

  lines.forEach(line => {
    if (line.startsWith('# ')) {
      html += `<div class="md-h1">${line.slice(2)}</div>`;
    } else if (line.startsWith('## ')) {
      html += `<div class="md-h2">${line.slice(3)}</div>`;
    } else if (line.trim() === '') {
      /* 빈 줄 무시 */
    } else {
      const colonIdx = line.indexOf(':');
      if (colonIdx > 0 && colonIdx <= 22) {
        const key = line.slice(0, colonIdx).trim();
        const val = line.slice(colonIdx + 1).trim();
        const colorMatch = val.match(/#[0-9a-fA-F]{3,8}/);
        const chip = colorMatch
          ? `<span class="color-chip" style="background:${colorMatch[0]}"></span>`
          : '';
        html += `<div class="md-row"><span class="md-key">${key}</span><span class="md-val">${chip}${escHtml(val)}</span></div>`;
      } else {
        html += `<div class="md-plain">${escHtml(line)}</div>`;
      }
    }
  });

  html += '</div>';
  return html;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Download ── */
function downloadMd() {
  if (!currentItem?.design) return;
  const blob = new Blob([currentItem.design], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentItem.nameEn}_DESIGN.md`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ── 이벤트 ── */
document.getElementById('btnClose').addEventListener('click', closeModal);
document.getElementById('btnDownload').addEventListener('click', downloadMd);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── Init ── */
renderFilter();
renderCards();
updateStats();

</script>
